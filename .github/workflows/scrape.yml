name: Scrape ŠOL rozvrh

on:
  # cron VYPNUT: ŠOL je za BotStopper anti-bot ochranou, která blokuje headless
  # Chromium bez ohledu na IP - GitHub-hostovaný runner proto nikdy neuspěje
  # (viz README "Klíčová rozhodnutí"). Ostrý provoz běží lokálně přes
  # scripts/run-scraper-and-publish.ps1 + Windows Task Scheduler s wake timerem.
  # schedule:
  #   - cron: '0,30 5-13 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Spustit i mimo okno 7:00-14:00 (Europe/Prague)'
        type: boolean
        default: false

concurrency:
  group: sol-scrape-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dow=$(TZ=Europe/Prague date +%u)     # 1=Po … 7=Ne
          h=$(TZ=Europe/Prague date +%-H)      # bez vedoucí nuly, viz architektura
          m=$(TZ=Europe/Prague date +%-M)
          mins=$((h * 60 + m))
          if [ "$dow" -le 5 ] && [ "$mins" -ge 420 ] && [ "$mins" -le 840 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet balíčků
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('scraper/SolScraper.csproj') }}

      - name: Cache Playwright prohlížečů
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/SolScraper.csproj') }}

      - name: Sestavit scraper
        working-directory: scraper
        run: dotnet build -c Release

      # Systémové .so knihovny žijí v OS runneru, který je při každém běhu čerstvý -
      # instalují se proto vždy, nezávisle na cache (ta drží jen binárku prohlížeče).
      - name: Instalovat systémové závislosti Chromia
        working-directory: scraper
        run: pwsh bin/Release/net10.0/playwright.ps1 install-deps chromium

      - name: Stáhnout Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: scraper
        run: pwsh bin/Release/net10.0/playwright.ps1 install chromium

      - name: Spustit scraper
        id: run
        working-directory: scraper
        env:
          SOL_USER: ${{ secrets.SOL_USER }}
          SOL_PASS: ${{ secrets.SOL_PASS }}
          # Bez klíče scraper skončí s kódem 64 - plaintext se na veřejné Pages nikdy nedostane.
          SOL_AES_KEY: ${{ secrets.SOL_AES_KEY }}
          # Volitelné - bez tohohle SentrySdk.Init neběží, scraper funguje dál beze změny.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SOL_OUT: out/rozvrh.json
          SOL_TIMETABLE_URL: ${{ vars.SOL_TIMETABLE_URL }}
          SOL_AUTO_CONSENT: ${{ vars.SOL_AUTO_CONSENT }}
        run: |
          set +e
          dotnet bin/Release/net10.0/SolScraper.dll
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publikovat do gh-pages
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name "sol-scraper[bot]"
          git config user.email "sol-scraper-bot@users.noreply.github.com"

          # Pojistka: jen šifrovaná obálka, nikdy plaintext (viz scraper/PayloadCrypto.cs).
          if ! grep -Eq '^\{"v":1,"iv":"[A-Za-z0-9+/=]{24}","c":"[A-Za-z0-9+/=]+"\}$' scraper/out/rozvrh.json; then
            echo "::error::rozvrh.json není šifrovaná obálka, publikace zrušena."
            exit 1
          fi

          # Deterministické IV -> stejný rozvrh = bajtově stejný soubor, commit se přeskočí.
          if git fetch origin gh-pages 2>/dev/null \
             && git show FETCH_HEAD:rozvrh.json 2>/dev/null | cmp -s - scraper/out/rozvrh.json; then
            echo "Rozvrh beze změny, publikace se přeskakuje."
            exit 0
          fi

          # gh-pages = vždy jeden orphan commit + force push: veřejné repo by jinak v historii
          # větve drželo každou verzi rozvrhu.
          git worktree add --orphan -b gh-pages-publish gh-pages-wt
          cp scraper/out/rozvrh.json gh-pages-wt/rozvrh.json
          touch gh-pages-wt/.nojekyll   # jinak Pages spustí Jekyll build nad JSONem

          cd gh-pages-wt
          git add rozvrh.json .nojekyll
          git commit -q -m "rozvrh: $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M %Z')"
          git push --force origin HEAD:gh-pages

      - name: Deaktivovat workflow po zamítnutí přihlašovacích údajů
        if: steps.run.outputs.exit_code == '2'
        run: |
          WORKFLOW_FILE=$(echo "${{ github.workflow_ref }}" | sed -E 's#.*/workflows/([^@]+)@.*#\1#')
          curl -sS -f -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/disable"
          echo "::error::SOL_PASS zamítnuto ŠOL. Riziko zámku účtu - workflow deaktivován. Oprav secret a zapni ho ručně v záložce Actions."

      - name: Nahrát debug výstupy
        if: steps.run.outputs.exit_code != '0'
        uses: actions/upload-artifact@v7
        with:
          name: sol-debug-${{ github.run_id }}
          path: scraper/debug/
          if-no-files-found: ignore
          retention-days: 5

      - name: Selhání běhu
        if: steps.run.outputs.exit_code != '0'
        run: |
          echo "Scraper skončil s exit kódem ${{ steps.run.outputs.exit_code }}."
          exit 1
